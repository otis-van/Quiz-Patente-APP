# Compila l'app Android e pubblica un .apk installabile direttamente sul telefono.
# Avvio: GitHub → Actions → "Build Android (.apk)" → Run workflow.
name: Build Android (.apk)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Genera il progetto nativo Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Compila APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Prepara il file
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/QuizPatenteB.apk
          ls -lh build/QuizPatenteB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuizPatenteB-apk
          path: build/QuizPatenteB.apk

      - name: Pubblica nella Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Quiz Patente B – Android build ${{ github.run_number }}
          prerelease: true
          files: build/QuizPatenteB.apk
          body: |
            Apri questo link dal telefono Android, scarica **QuizPatenteB.apk** e installalo
            (consenti l'installazione da "origini sconosciute" se richiesto).
            Commit: ${{ github.sha }}
